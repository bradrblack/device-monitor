; PlatformIO Project Configuration File
;
; Device Monitor. One firmware image serves every unit: the device name, Wi-Fi,
; calibration and connections are all set at run time (setup portal on first
; boot, then the web page at http://<name>.local/). See README.md.
;
;   pio run                                    build (env:devmon)
;   pio run -t upload                          first flash, over USB
;   pio run -e devmon-ota -t upload --upload-port <name>.local
;                                              later updates, over Wi-Fi
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = devmon
; The OTA password lives in secrets.ini (git-ignored; copy secrets.ini.example).
; It's used both to build the firmware and to authenticate OTA uploads, and is
; also the web page's first admin password.
extra_configs = secrets*.ini

[env]
; Same toolchain as Sump Master 2000. The platform is pinned because the
; unpinned "stable" release's esptool crashed mid-upload; don't unpin it.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
; Two 1.9 MB app slots for OTA (the default table's 1.25 MB is too tight).
; The partition table can't change over the air: the first flash after
; changing it must be over USB.
board_build.partitions = min_spiffs.csv
build_flags =
    ; enable USB serial
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DOTA_PASSWORD=\"${secrets.ota_password}\"
monitor_speed = 115200
upload_speed = 115200
upload_protocol = esptool
lib_deps =
    https://github.com/adafruit/Adafruit_ADXL345.git
    knolleary/PubSubClient@^2.8
    tzapu/WiFiManager@^2.0.17

; ---- Tunables ---------------------------------------------------------------
; All optional; defaults live in the sketch and every one can be changed on the
; board's web page without reflashing (values saved there win):
;   ON_RMS_THRESHOLD / OFF_RMS_THRESHOLD  vibration thresholds, m/s^2 RMS
;   RUN_CONFIRM_MS / STOP_CONFIRM_MS      continuous vibration/quiet needed to
;                                         start/stop a run
;   TZ_STRING                             POSIX time zone (default US Eastern)
;   LED_NEOPIXEL                          1 = SuperMini v2 NeoPixel on GPIO 8,
;                                         0 = plain active-low LED

[env:devmon]
build_flags =
    ${env.build_flags}
    -DON_RMS_THRESHOLD=0.50f
    -DOFF_RMS_THRESHOLD=0.30f
    -DRUN_CONFIRM_MS=3000UL
    -DSTOP_CONFIRM_MS=3000UL

; Same firmware, uploaded over Wi-Fi with ArduinoOTA. The board must be powered,
; on the network, and idle (it doesn't accept updates while the machine runs).
; Name the unit with --upload-port <name>.local (or its IP address).
[env:devmon-ota]
extends = env:devmon
upload_protocol = espota
upload_port = ${secrets.ota_host}
upload_flags =
    --auth=${secrets.ota_password}

; For an older ESP32-C3 SuperMini with a plain blue LED (lit when GPIO 8 is LOW)
; instead of the v2's NeoPixel.
[env:devmon-plain-led]
extends = env:devmon
build_flags =
    ${env:devmon.build_flags}
    -DLED_NEOPIXEL=0
