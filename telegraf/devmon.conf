# Drop-in Telegraf config: Device Monitor boards -> InfluxDB 2.x.
#
# Optional: the boards can also write straight to InfluxDB 2.x's write API with
# a token (see README.md). Use Telegraf instead if you'd rather not put an
# InfluxDB token on the boards, or already run it.
#
# Install on the InfluxDB host as /etc/telegraf/telegraf.d/devmon.conf (adjust
# for your OS), put the variables from devmon.env.example in Telegraf's
# environment file, then restart Telegraf. (With Docker, mount it as
# /etc/telegraf/telegraf.conf; see the README.) Then set each board's InfluxDB
# address on its web page to http://<this host>:8186/devmon (no token).
#
# The boards POST InfluxDB line protocol, already timestamped by their own
# NTP-synced clocks. Telegraf passes it straight through. Every point is
# tagged device=<the board's name>:
#   appliance_state    start/stop as it happens: event, running, seconds (stop),
#                      rms_avg / rms_min (stop: that run's vibration);
#                      note="restart" / "sensor_lost" on corrections
#   appliance_reading  every 10 min: running, sensor_ok, cycles, run_s,
#                      rssi, heap, rms_idle_avg/max, rms_run_avg/min,
#                      rms_on, rms_off
#   appliance_boot     each boot: version, reason, sensor
#   appliance_config   thresholds changed on the web page
#   appliance_test     "Send a test" on the web page

[[inputs.http_listener_v2]]
  service_address = ":8186"
  paths = ["/devmon"]
  methods = ["POST"]
  data_format = "influx"
  # The listener is unauthenticated, so anything on the LAN can write to it.
  # To require a password, set these and put the same credentials in each
  # board's address (http://user:pass@host:8186/devmon).
  # basic_username = "${DEVMON_HTTP_USER}"
  # basic_password = "${DEVMON_HTTP_PASS}"

# namepass keeps this from also receiving (or duplicating) metrics from other
# inputs in your main telegraf.conf.
[[outputs.influxdb_v2]]
  namepass = ["appliance_*"]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
